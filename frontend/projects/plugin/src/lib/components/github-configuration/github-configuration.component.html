<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
  } as obs"
>
  <v-input
    name="configurationTitle"
    [title]="'configurationTitle' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.configurationTitle"
    [required]="true"
    [tooltip]="'configurationTitleTooltip' | pluginTranslate: pluginId | async"
    [widthPx]="350"
    placeholder="GitHub Plugin"
  ></v-input>

  <v-input
    name="url"
    [title]="'url' | pluginTranslate: pluginId | async"
    [fullWidth]="true"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.url || 'https://api.github.com'"
    [required]="true"
    [tooltip]="'urlTooltip' | pluginTranslate: pluginId | async"
    placeholder="https://api.github.com"
  ></v-input>

  <v-input
    name="token"
    type="password"
    [title]="'token' | pluginTranslate: pluginId | async"
    [fullWidth]="true"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.token"
    [required]="true"
    [tooltip]="'tokenTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="defaultRepository"
    [title]="'defaultRepository' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.defaultRepository"
    [required]="false"
    [tooltip]="'defaultRepositoryTooltip' | pluginTranslate: pluginId | async"
    placeholder="owner/repo"
  ></v-input>

  <v-input
    name="graphqlUrl"
    [title]="'graphqlUrl' | pluginTranslate: pluginId | async"
    [fullWidth]="true"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.graphqlUrl"
    [required]="false"
    [tooltip]="'graphqlUrlTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="perPage"
    type="number"
    [title]="'perPage' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.perPage || 100"
    [required]="false"
    [tooltip]="'perPageTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="maxPages"
    type="number"
    [title]="'maxPages' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.maxPages || 5"
    [required]="false"
    [tooltip]="'maxPagesTooltip' | pluginTranslate: pluginId | async"
  ></v-input>
</v-form>
