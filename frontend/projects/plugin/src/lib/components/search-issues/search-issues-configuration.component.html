<p style="margin-bottom: 1.5rem">{{ 'searchIssuesDescription' | pluginTranslate: pluginId | async }}</p>

<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null,
    orderItems: orderItems$ | async
  } as obs"
>
  <v-input
    name="query"
    [title]="'query' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="true"
    [defaultValue]="obs.prefill?.query"
    [placeholder]="'org:ritense is:pr is:open label:maintained-by-ai'"
    [tooltip]="'queryTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="sort"
    [title]="'sort' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.sort"
    [placeholder]="'updated'"
    [tooltip]="'sortTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-select
    name="order"
    [items]="obs.orderItems || []"
    [title]="'order' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultSelectionId]="obs.prefill?.order"
    [tooltip]="'orderTooltip' | pluginTranslate: pluginId | async"
  ></v-select>

  <v-input
    name="limit"
    type="number"
    [title]="'limit' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.limit"
    [tooltip]="'limitTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="resultVariable"
    [title]="'resultVariable' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.resultVariable"
    [tooltip]="'resultVariableTooltip' | pluginTranslate: pluginId | async"
  ></v-input>
</v-form>
