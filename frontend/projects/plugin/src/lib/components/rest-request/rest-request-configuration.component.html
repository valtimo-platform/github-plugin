<p style="margin-bottom: 1.5rem">{{ 'restRequestDescription' | pluginTranslate: pluginId | async }}</p>

<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null,
    methodItems: methodItems$ | async
  } as obs"
>
  <v-select
    name="method"
    [items]="obs.methodItems || []"
    [title]="'method' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultSelectionId]="obs.prefill?.method"
    [tooltip]="'methodTooltip' | pluginTranslate: pluginId | async"
  ></v-select>

  <v-input
    name="path"
    [title]="'restPath' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="true"
    [defaultValue]="obs.prefill?.path"
    [placeholder]="'/repos/{owner}/{repo}/releases'"
    [tooltip]="'restPathTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="body"
    [title]="'restBody' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.body"
    [placeholder]="'{&quot;title&quot;: &quot;pv:issueTitle&quot;}'"
    [tooltip]="'restBodyTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="resultVariable"
    [title]="'resultVariable' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.resultVariable"
    [tooltip]="'resultVariableTooltip' | pluginTranslate: pluginId | async"
  ></v-input>
</v-form>
