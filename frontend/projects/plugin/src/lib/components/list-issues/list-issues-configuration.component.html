<p style="margin-bottom: 1.5rem">{{ 'listIssuesDescription' | pluginTranslate: pluginId | async }}</p>

<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null,
    stateItems: stateItems$ | async
  } as obs"
>
  <v-input
    name="repository"
    [title]="'repository' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.repository"
    [placeholder]="'owner/repo'"
    [tooltip]="'repositoryTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-select
    name="state"
    [items]="obs.stateItems || []"
    [title]="'state' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultSelectionId]="obs.prefill?.state"
    [tooltip]="'stateTooltip' | pluginTranslate: pluginId | async"
  ></v-select>

  <v-input
    name="labels"
    [title]="'labels' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.labels"
    [placeholder]="'bug, feedback'"
    [tooltip]="'labelsTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="assignee"
    [title]="'assignee' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.assignee"
    [tooltip]="'assigneeTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="creator"
    [title]="'creator' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.creator"
    [tooltip]="'creatorTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="since"
    [title]="'since' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.since"
    [placeholder]="'2026-01-01T00:00:00Z'"
    [tooltip]="'sinceTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="limit"
    type="number"
    [title]="'limit' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.limit"
    [tooltip]="'limitTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="resultVariable"
    [title]="'resultVariable' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.resultVariable"
    [tooltip]="'resultVariableTooltip' | pluginTranslate: pluginId | async"
  ></v-input>
</v-form>
