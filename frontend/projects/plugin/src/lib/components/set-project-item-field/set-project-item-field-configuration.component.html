<p style="margin-bottom: 1.5rem">{{ 'setProjectItemFieldDescription' | pluginTranslate: pluginId | async }}</p>

<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null,
    valueTypeItems: valueTypeItems$ | async
  } as obs"
>
  <v-input
    name="projectId"
    [title]="'projectId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="true"
    [defaultValue]="obs.prefill?.projectId"
    [placeholder]="'pv:projectId'"
    [tooltip]="'projectIdTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="itemId"
    [title]="'itemId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="true"
    [defaultValue]="obs.prefill?.itemId"
    [placeholder]="'pv:projectItemId'"
    [tooltip]="'itemIdTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="fieldId"
    [title]="'fieldId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="true"
    [defaultValue]="obs.prefill?.fieldId"
    [placeholder]="'pv:sprintFieldId'"
    [tooltip]="'fieldIdTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-select
    name="valueType"
    [items]="obs.valueTypeItems || []"
    [title]="'valueType' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="true"
    [defaultSelectionId]="obs.prefill?.valueType"
    [tooltip]="'valueTypeTooltip' | pluginTranslate: pluginId | async"
  ></v-select>

  <v-input
    name="value"
    [title]="'value' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="true"
    [defaultValue]="obs.prefill?.value"
    [tooltip]="'valueTooltip' | pluginTranslate: pluginId | async"
  ></v-input>

  <v-input
    name="resultVariable"
    [title]="'resultVariable' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [required]="false"
    [defaultValue]="obs.prefill?.resultVariable"
    [tooltip]="'resultVariableTooltip' | pluginTranslate: pluginId | async"
  ></v-input>
</v-form>
